# Edit paths to trusted operator assets before starting. No automatic downloads.
schema_version: "1"
trusted_plugin_allowlist: [oflow-legacy]
plugins:
  - name: oflow-legacy
    version: 1.0.0b1
    api_version: "1"
    entry_point: oflow.legacy:register
    capabilities: [legacy]
backends:
  - id: legacy-oris
    kind: legacy
    concurrency: 1
    options:
      selector_script: assets/v2_candidate_selector.py
      pipeline_script: assets/v2_stage_v2_pipeline_oris.py
      checkpoint: assets/model.pt
      tokenizer: assets/tokenizer
      model_family: oris
      trust_external_code: true
      document:
        max_length: 1024
        token_budget: 16384
      paragraph:
        max_length: 256
        token_budget: 8192
        tokenize_window: 256
        min_padding_efficiency: 0.8
routing:
  rules:
    legacy.semantic: [legacy-oris]

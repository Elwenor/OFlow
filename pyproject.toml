[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oflow-engine"
version = "1.0.0b1"
description = "Bounded, tenant-aware AI workload execution on one machine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic>=2.12,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
api = ["fastapi>=0.135,<1", "uvicorn>=0.30,<1"]
http = ["httpx>=0.28,<1"]
hardware = ["psutil>=5.9,<8"]
telemetry = ["opentelemetry-api>=1.30,<2"]
torch = ["torch>=2.10,<3"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "fastapi>=0.135,<1", "uvicorn>=0.30,<1", "ruff>=0.12,<1", "mypy>=1.15,<2", "types-PyYAML>=6"]

[project.scripts]
oflow = "oflow.cli:main"

[project.urls]
Repository = "https://github.com/Elwenor/OFlow"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: optional physical CUDA validation", "legacy: requires original selector, pipeline and checkpoint"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["oflow"]
mypy_path = "src"
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true

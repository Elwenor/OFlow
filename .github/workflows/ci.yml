name: CPU validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,http,hardware]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples
      - run: python -m mypy -p oflow
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: oflow validate --config configs/cpu.yaml
      - run: python examples/cpu_only.py
      - run: python examples/profiles.py
      - run: python examples/routing.py
      - run: python examples/external_inference.py
      - run: python -m examples.custom_plugin
  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,http]' 'torch>=2.10,<3' --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/test_legacy.py tests/test_torch.py -q
